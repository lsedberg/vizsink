[package]
name = "vizsink-bin"
version = "0.1.0"
edition = "2024"

[profile.relase]
lto = true
codegen-units = 1
strip = true

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
futures-util = "0.3.31"
include_dir = "0.7.4"
mime_guess = "2.0.5"
serde = "1.0.228"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
